---
layout: default
---

<div class="page-header">
  <div class="wrap">
    <h1>{{ page.title }}</h1>
    <p>{{ page.dates }}</p>
  </div>
</div>

<section>
  <div class="event-detail">
    <div class="event-photo-frame{% if page.decor %} decor-{{ page.decor }}{% endif %}">
      {% if page.decor == "helis" %}
        {% include icon-heli.html class="photo-decor h1" %}
        {% include icon-heli.html class="photo-decor h2" %}
        {% include icon-heli.html class="photo-decor h3" %}
      {% endif %}
      <img class="event-detail-img" src="{{ page.image | relative_url }}" alt="{{ page.title }}" style="max-width: {{ page.image_width | default: 505 }}px;">
    </div>
    <div class="event-detail-body">
      {{ content }}
    </div>
  </div>
</section>
