---
layout: default
---

<div class="page-header">
  <div class="wrap">
    <h1>{{ page.title }}</h1>
    <p>{{ page.dates }}</p>
  </div>
</div>

<section>
  <div class="event-detail">
    <img class="event-detail-img" src="{{ page.image | relative_url }}" alt="{{ page.title }}">
    <div class="event-detail-body">
      {{ content }}
    </div>
  </div>
</section>
